<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTAMINER — Nexus Control</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#020202;--card:rgba(10,12,16,.85);--card-border:#00ffcc44;--text:#e0fff4;--text-dim:#00ffcc88;--accent:#00ffcc;--danger:#ff0055;--radius:4px;--glow:0 0 10px rgba(0,255,204,0.5)}
body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;background-image:linear-gradient(rgba(0,255,204,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,204,0.03) 1px,transparent 1px);background-size:20px 20px}
canvas#stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;opacity:0.6}
.app{position:relative;z-index:1}
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--card-border);border-radius:var(--radius);padding:40px;width:100%;max-width:400px;text-align:center;box-shadow:var(--glow)}
.login-box h1{font-family:'Share Tech Mono',monospace;font-size:2.2rem;margin-bottom:10px;color:var(--accent);text-shadow:var(--glow)}
.login-box input{width:100%;background:#00110d;border:1px solid var(--card-border);border-radius:2px;padding:12px;color:var(--accent);font-family:'Share Tech Mono',monospace;font-size:1rem;margin-bottom:20px;text-align:center;outline:none}
.login-box input:focus{box-shadow:var(--glow)}
.btn{padding:10px 24px;border:1px solid var(--accent);background:rgba(0,255,204,0.1);color:var(--accent);font-family:'Share Tech Mono',monospace;font-size:1rem;cursor:pointer;transition:all .2s;text-transform:uppercase}
.btn:hover{background:var(--accent);color:#000;box-shadow:var(--glow)}
#dash{display:none;max-width:1200px;margin:0 auto;padding:30px 20px}
.topbar{display:flex;justify-content:space-between;border-bottom:1px solid var(--card-border);padding-bottom:15px;margin-bottom:30px}
.topbar h1{font-family:'Share Tech Mono',monospace;color:var(--accent);text-shadow:var(--glow)}
.card{background:var(--card);border:1px solid var(--card-border);padding:20px;margin-bottom:20px;box-shadow:0 4px 6px rgba(0,0,0,0.5)}
.card-t{font-family:'Share Tech Mono',monospace;color:var(--accent);font-size:1.2rem;margin-bottom:15px;border-bottom:1px solid #00ffcc22;padding-bottom:5px}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.stat-box{background:#000;border:1px solid #00ffcc33;padding:20px;text-align:center}
.stat-box .val{font-family:'Share Tech Mono',monospace;font-size:1.8rem;color:var(--accent);text-shadow:var(--glow)}
.stat-box .lbl{font-size:0.8rem;color:var(--text-dim);text-transform:uppercase}
.wk{background:#000;border:1px solid #00ffcc33;padding:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.wk-name{font-family:'Share Tech Mono',monospace;font-size:1.1rem}
.wk-status{color:var(--accent);font-size:0.9rem}
.wk.offline .wk-status{color:var(--danger)}
.toast{position:fixed;bottom:20px;right:20px;padding:15px;background:var(--card);border:1px solid var(--accent);color:var(--accent);font-family:'Share Tech Mono',monospace;opacity:0;transition:0.3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="app">
<div id="login">
<div class="login-box">
<h1>NEXUS_LINK</h1>
<p style="color:var(--text-dim);margin-bottom:20px;font-family:'Share Tech Mono'">AWAITING AUTHORIZATION</p>
<input type="password" id="tokenIn" placeholder="SYS_TOKEN">
<button class="btn" onclick="doLogin()">INITIALIZE</button>
</div>
</div>
<div id="dash">
<div class="topbar">
<h1>[ ULTAMINER_NEXUS_v2.0 ]</h1>
<div><button class="btn" onclick="logout()">TERMINATE</button></div>
</div>
<div class="card">
<div class="card-t">>_ FLEET_TELEMETRY</div>
<div class="stats-grid">
<div class="stat-box"><div class="val" id="s_hash">0.0</div><div class="lbl">TOTAL_H/S</div></div>
<div class="stat-box"><div class="val" id="s_wk">0</div><div class="lbl">ACTIVE_NODES</div></div>
<div class="stat-box"><div class="val" id="s_btc">0.000</div><div class="lbl">EST_YIELD</div></div>
</div>
</div>
<div class="card">
<div class="card-t">>_ ACTIVE_NODES</div>
<div id="wList"><div style="color:var(--text-dim);text-align:center;padding:20px;font-family:'Share Tech Mono'">AWAITING_CONNECTIONS...</div></div>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
// Starfield
const c=document.getElementById('stars'),x=c.getContext('2d');
let W,H,stars=[];
function resize(){W=c.width=innerWidth;H=c.height=innerHeight;stars=[];for(let i=0;i<150;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2})}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#00ffcc';for(let s of stars){s.y+=s.s;if(s.y>H)s.y=0;x.fillRect(s.x,s.y,1,1)}requestAnimationFrame(draw)}
resize();draw();window.addEventListener('resize',resize);

const REPO = 'HolyV200/test-repo';
let PAT = '';

function doLogin(){
    PAT = document.getElementById('tokenIn').value.trim();
    if(PAT){
        document.getElementById('login').style.display='none';
        document.getElementById('dash').style.display='block';
        fetchWorkers();
        setInterval(fetchWorkers, 10000);
    }
}

function logout(){ location.reload(); }

function showToast(msg){
    const t=document.getElementById('toast');
    t.innerText=msg;t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),3000);
}

async function fetchWorkers(){
    try{
        const r=await fetch(https://api.github.com/repos/+REPO+/contents/status, {
            headers:{'Authorization':'token '+PAT,'Accept':'application/vnd.github.v3+json'}
        });
        if(!r.ok) return;
        const files=await r.json();
        let html='',totHash=0,active=0;
        
        for(let f of files){
            if(f.name.endsWith('.json')){
                try{
                    const r2=await fetch(f.download_url);
                    const st=await r2.json();
                    const age=(Date.now() - new Date(st.time).getTime())/1000;
                    const isOnline = age < 600;
                    if(isOnline) { active++; totHash += st.hashrate; }
                    
                    html += <div class="wk ">
                        <div class="wk-name"> <span style="font-size:0.8em;color:var(--text-dim)">[...]</span></div>
                        <div class="wk-status"></div>
                    </div>;
                }catch(e){}
            }
        }
        document.getElementById('wList').innerHTML = html || '<div style="color:var(--text-dim)">NO_NODES_FOUND</div>';
        document.getElementById('s_wk').innerText = active;
        document.getElementById('s_hash').innerText = totHash.toFixed(1);
    }catch(e){showToast('SYNC_ERROR');}
}
</script>
</body>
</html>
